name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          # These files/folders are intentionally NOT in the repo (they hold
          # real database/SMTP credentials, or are installed separately via
          # Composer) — excluding them stops this action from deleting them
          # off the live server just because they're not in git.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            api/config.local.php
            api/email_config.local.php
