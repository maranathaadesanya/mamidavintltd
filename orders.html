<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | Mamidav</title><link rel="stylesheet" href="style.css"></head><body data-require-login="true" data-require-admin="true"><main class="container section"><p><a href="dashboard.html">← Dashboard</a></p><h2>Order History</h2><div class="card"><input id="order-search" placeholder="Search reference, customer, email or phone"><select id="payment-filter"><option value="">All payment statuses</option><option value="pending">Pending</option><option value="paid">Paid</option><option value="failed">Failed</option></select><button class="btn" onclick="loadOrders(1)">Search</button></div><div class="table-wrap"><table class="cart-table"><thead><tr><th>Reference</th><th>Customer</th><th>Source</th><th>Payment</th><th>Status</th><th>Total</th><th>Action</th></tr></thead><tbody id="orders-body"></tbody></table></div><div id="orders-pages" class="cart-actions"></div></main><script src="cart.js"></script><script>let ordersPage=1;async function loadOrders(page){ordersPage=page;const q=encodeURIComponent(document.getElementById('order-search').value),p=encodeURIComponent(document.getElementById('payment-filter').value);const r=await fetch('/api/orders_list.php?page='+page+'&q='+q+'&payment_status='+p),d=await r.json();document.getElementById('orders-body').innerHTML=d.orders.map(o=>`<tr><td>${o.reference}</td><td>${o.customer_name}</td><td>${o.order_source}</td><td>${o.payment_method||'-'}</td><td>${o.payment_status}/${o.order_status}</td><td>₦${Number(o.total).toLocaleString()}</td><td><button onclick="updateOrder(${o.id},'paid')">Mark Paid</button> <button onclick="updateOrder(${o.id},'reject')">Reject</button></td></tr>`).join('')||'<tr><td colspan="7">No orders found.</td></tr>';document.getElementById('orders-pages').innerHTML=`Showing page ${d.page} of ${d.pages} <button ${d.page===1?'disabled':''} onclick="loadOrders(${d.page-1})">← Previous</button> <button ${d.page===d.pages?'disabled':''} onclick="loadOrders(${d.page+1})">Next →</button>`}async function updateOrder(id,action){if(!confirm('Confirm this order update?'))return;const notes=prompt('Verification notes (optional):')||'';await fetch('/api/order_update.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action,notes})});loadOrders(ordersPage)}loadOrders(1);</script></body></html>
