<div class="page-intro">
<h2>Create Your Account</h2>
<p>Get a personal cart and profile that follows you across devices.</p>
</div>

<div class="container">
<form class="form-card" id="signup-form" onsubmit="return doSignup(this)">
<p id="form-error" style="color:#a33;font-size:13px;margin:0"></p>
<label>Full Name<input type="text" name="full_name" required></label>
<label>Email<input type="email" name="email" required></label>
<label>Phone<input type="tel" name="phone"></label>
<label>Password (min. 8 characters)<input type="password" name="password" minlength="8" required></label>
<label>Confirm Password<input type="password" name="confirm_password" minlength="8" required></label>
<button type="submit" class="btn">Create Account</button>
<p class="form-note">Already have an account? <a href="login.html" style="color:#3e0303">Log in</a></p>
</form>
</div>
